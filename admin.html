<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin | MiCT Survey Responses</title>
<link rel="icon" type="image/png" href="images/form.png" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #0A3FB4;
    --bg: #F5F5F5;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e0e0e0;
    --white: #ffffff;
    --red: #c0392b;
  }

  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* LOGIN */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-card {
    background: white;
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 400px;
    width: 100%;
    border: 1px solid var(--border);
    text-align: center;
  }

  .login-card h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--blue);
    margin-bottom: 8px;
  }

  .login-card p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .pw-input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    outline: none;
    color: var(--text);
    transition: border-color 0.2s;
    margin-bottom: 14px;
    text-align: center;
    letter-spacing: 4px;
  }

  .pw-input:focus { border-color: var(--blue); }

  .login-btn {
    width: 100%;
    background: var(--blue);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    padding: 14px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(10,63,180,0.3); }

  .error-msg {
    color: var(--red);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  /* DASHBOARD */
  #dashboard { display: none; padding: 32px 24px 80px; }

  .dash-header {
    max-width: 1200px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .dash-header h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--blue);
  }

  .dash-header p { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .header-btns { display: flex; gap: 10px; }

  .refresh-btn, .logout-btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border-radius: 50px;
    padding: 10px 22px;
    cursor: pointer;
    border: 1.5px solid var(--blue);
    transition: all 0.15s;
  }

  .refresh-btn { background: var(--blue); color: white; }
  .refresh-btn:hover { box-shadow: 0 3px 10px rgba(10,63,180,0.3); }
  .logout-btn { background: white; color: var(--blue); }
  .logout-btn:hover { background: var(--bg); }

  /* STATS */
  .stats-grid {
    max-width: 1200px;
    margin: 0 auto 28px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
  }

  .stat-card {
    background: white;
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 20px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 36px;
    color: var(--blue);
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label { font-size: 12px; color: var(--muted); }

  /* TABLE */
  .table-wrap {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .table-toolbar {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .table-toolbar h2 {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--text);
  }

  .search-input {
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
    width: 220px;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--blue); }

  .table-scroll { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 900px;
  }

  thead tr { background: var(--bg); }

  th {
    padding: 12px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid #f5f5f5;
    color: var(--text);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }

  .no-data {
    text-align: center;
    padding: 48px;
    color: var(--muted);
    font-size: 14px;
  }

  .loading {
    text-align: center;
    padding: 48px;
    color: var(--muted);
    font-size: 14px;
  }

  .row-num {
    color: var(--muted);
    font-size: 12px;
    min-width: 32px;
  }

  /* MODAL */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-bg.open { display: flex; }

  .modal {
    background: white;
    border-radius: 20px;
    padding: 32px;
    max-width: 640px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal h2 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--blue);
    margin-bottom: 20px;
  }

  .modal-row {
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid #f0f0f0;
  }

  .modal-row:last-child { border-bottom: none; margin-bottom: 0; }

  .modal-q {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .modal-a {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .modal-close {
    display: block;
    width: 100%;
    margin-top: 20px;
    background: var(--bg);
    border: none;
    border-radius: 50px;
    padding: 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--muted);
    cursor: pointer;
  }

  .view-btn {
    background: none;
    border: 1px solid var(--blue);
    color: var(--blue);
    border-radius: 50px;
    padding: 4px 12px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    white-space: nowrap;
  }

  .view-btn:hover { background: var(--blue); color: white; }

  @media (max-width: 600px) {
    #dashboard { padding: 20px 12px 60px; }
    .login-card { padding: 36px 24px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h1>🔒 Admin</h1>
    <p>MiCT Team only</p>
    <input class="pw-input" type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter') login()" />
    <button class="login-btn" onclick="login()">Enter</button>
    <p class="error-msg" id="error-msg">Wrong password. Try again.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="dash-header">
    <div>
      <h1>Survey Responses</h1>
      <p>2026 WFK IT Pre-Survey · MiCT Team</p>
    </div>
    <div class="header-btns">
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="stat-total">—</div>
      <div class="stat-label">Total Responses</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-today">—</div>
      <div class="stat-label">Today</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-programming">—</div>
      <div class="stat-label">Know Programming</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-kpop">—</div>
      <div class="stat-label">Listen to K-Pop</div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-toolbar">
      <h2>All Responses</h2>
      <input class="search-input" type="text" id="search-input" placeholder="Search..." oninput="filterTable()" />
    </div>
    <div class="table-scroll">
      <table id="response-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Major / Field</th>
            <th>Programming Level</th>
            <th>Want to Learn</th>
            <th>K-Pop</th>
            <th>K-Drama</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="8" class="loading">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <h2 id="modal-title">Response Detail</h2>
    <div id="modal-content"></div>
    <button class="modal-close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  const PASSWORD = 'mict2026';
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGc-U9YhYc3RWnGWVr0rhDb0dhdLVWkxo93M3myvOa01JlzIYCrafM78756en3qZnC/exec';

  const LABELS = [
    'Date', 'Major / Field of Study', 'Programming Level',
    'Languages Used', 'Want to Learn', 'Interested Topics',
    'Hands-on Activities', 'Why Learn Programming',
    'Hope to Gain', 'Instructors Help With', 'Specific to Learn',
    'Korean Cultural Topics', 'Interest in Korean Culture',
    'Listens to K-Pop', 'Favorite K-Pop Artists',
    'Watched K-Drama', 'Favorite K-Dramas', 'Cultural Activities'
  ];

  let allRows = [];

  function login() {
    const val = document.getElementById('pw-input').value;
    if (val === PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }

  function logout() {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('pw-input').value = '';
  }

  function loadData() {
    document.getElementById('table-body').innerHTML = '<tr><td colspan="8" class="loading">Loading...</td></tr>';
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    script.src = SCRIPT_URL + '?action=get&callback=' + callbackName;
    window[callbackName] = function(data) {
      allRows = data.rows || [];
      renderTable(allRows);
      updateStats(allRows);
      delete window[callbackName];
      document.body.removeChild(script);
    };
    script.onerror = function() {
      document.getElementById('table-body').innerHTML = '<tr><td colspan="8" class="no-data">Failed to load. Please redeploy Apps Script.</td></tr>';
      delete window[callbackName];
    };
    document.body.appendChild(script);
  }

  function updateStats(rows) {
    document.getElementById('stat-total').textContent = rows.length;
    const today = new Date().toLocaleDateString();
    const todayCount = rows.filter(r => new Date(r[0]).toLocaleDateString() === today).length;
    document.getElementById('stat-today').textContent = todayCount;
    const progCount = rows.filter(r => r[2] && r[2] !== 'Never').length;
    document.getElementById('stat-programming').textContent = progCount;
    const kpopCount = rows.filter(r => r[13] && (r[13].toLowerCase().includes('yes') || r[13].toLowerCase().includes('sometimes'))).length;
    document.getElementById('stat-kpop').textContent = kpopCount;
  }

  function renderTable(rows) {
    const tbody = document.getElementById('table-body');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="no-data">No responses yet.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map((row, i) => `
      <tr>
        <td class="row-num">${i + 1}</td>
        <td>${row[0] ? new Date(row[0]).toLocaleDateString() : '—'}</td>
        <td title="${row[1] || ''}">${row[1] || '—'}</td>
        <td>${row[2] || '—'}</td>
        <td title="${row[4] || ''}">${row[4] || '—'}</td>
        <td>${row[13] || '—'}</td>
        <td>${row[15] || '—'}</td>
        <td><button class="view-btn" onclick="openModal(${i})">View</button></td>
      </tr>
    `).join('');
  }

  function filterTable() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = allRows.filter(row => row.some(cell => String(cell).toLowerCase().includes(q)));
    renderTable(filtered);
  }

  function openModal(i) {
    const row = allRows[i];
    document.getElementById('modal-title').textContent = `Response #${i + 1}`;
    document.getElementById('modal-content').innerHTML = LABELS.map((label, j) => `
      <div class="modal-row">
        <div class="modal-q">${label}</div>
        <div class="modal-a">${row[j] || '—'}</div>
      </div>
    `).join('');
    document.getElementById('modal-bg').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-bg').classList.remove('open');
  }
</script>
</body>
</html>
